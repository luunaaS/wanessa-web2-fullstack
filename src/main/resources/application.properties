spring.application.name=wanessa-web2-fullstack

#Banco H2 em arquivo (os dados sobrevivem ao reinício)
spring.datasource.url=jdbc:h2:file:./database.db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#H2 Console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Envia a mensagem das exceções (regras de negócio) no JSON de erro
spring.web.error.include-message=always